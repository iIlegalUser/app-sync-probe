name: 🌱 WorkBuddy Daily

on:
  schedule:
    # 北京时间 07:00 / 12:00 / 23:30（GitHub cron 用 UTC，北京时间 = UTC+8）
    - cron: "0 23 * * *"     # 07:00
    - cron: "0 4 * * *"      # 12:00
    - cron: "30 15 * * *"    # 23:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

concurrency:
  group: workbuddy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # mp 对话任务按真人节奏上报（每条 45s±10s），账号多时耗时更长
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run WorkBuddy
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_TASKS: ${{ secrets.WORKBUDDY_TASKS }}
          WORKBUDDY_SKIP_TASKS: ${{ secrets.WORKBUDDY_SKIP_TASKS }}
          WORKBUDDY_MP_GAP: ${{ secrets.WORKBUDDY_MP_GAP }}
        run: python workbuddy_daily.py

      # 🌍 国际版（www.workbuddy.ai）每日活跃：探测 → 领取 → 免费模型保活
      # 与国际版登录态分开配置：WORKBUDDY_INTL_TOKENS = 备注|AT|uid|RT（RT 可续期）
      - name: Run WorkBuddy AI (international)
        if: always()
        continue-on-error: true
        env:
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          WORKBUDDY_INTL_MODELS: ${{ secrets.WORKBUDDY_INTL_MODELS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          QYWX_TOKEN: ${{ secrets.QYWX_TOKEN }}
          NO_NOTIFY: ${{ secrets.NO_NOTIFY }}
        run: python workbuddy_intl_daily.py

      # ⚠️ 仅在【私有仓库】中持久化令牌状态；公开仓库会跳过，避免 RT 泄露
      - name: Persist token state (private repo only)
        if: always() && github.event.repository.private == true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wb_refresh_tokens.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "令牌状态无变化"
          else
            git commit -m "chore: 更新令牌状态 [skip ci]"
            git push

  # 🔄 自动同步上游（L0NE-6 → 本 fork）
  # 串在签到 job 之后：令牌持久化与同步都要 push，串行可避开并发 non-fast-forward
  sync-upstream:
    needs: run
    if: always()            # 签到失败/跳过也要同步，避免卡在上游进度之外
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # merge 需要完整历史

      - name: Merge upstream
        env:
          UPSTREAM: L0NE-6/WorkBuddy-Daily
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main

          NEW=$(git rev-list --count "HEAD..upstream/main")
          if [ "$NEW" = "0" ]; then
            echo "✅ 已与上游齐平，无需同步"
            exit 0
          fi
          echo "📥 上游领先 ${NEW} 个提交，开始合并"

          # fork 特有：workbuddy.yml 的国际版步骤、wb_refresh_tokens.json
          # 与上游处于不同区段/文件，正常不会冲突；一旦冲突则失败并告警，交由人工处理
          git merge upstream/main --no-edit -m "chore: 同步上游 ${UPSTREAM}"
          git push origin HEAD:main
