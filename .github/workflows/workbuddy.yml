name: 🌱 WorkBuddy Daily

on:
  schedule:
    # 北京时间 07:00 / 12:00 / 23:30（GitHub cron 用 UTC，北京时间 = UTC+8）
    - cron: "0 23 * * *"     # 07:00
    - cron: "0 4 * * *"      # 12:00
    - cron: "30 15 * * *"    # 23:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

concurrency:
  group: workbuddy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # mp 对话任务按真人节奏上报（每条 45s±10s），账号多时耗时更长
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Restore benefit guard
        uses: actions/cache@v4
        with:
          path: workbuddy_benefit_state.json
          key: workbuddy-benefit-state-${{ github.run_id }}
          restore-keys: |
            workbuddy-benefit-state-

      - name: Run WorkBuddy
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_TASKS: ${{ secrets.WORKBUDDY_TASKS }}
          WORKBUDDY_SKIP_TASKS: ${{ secrets.WORKBUDDY_SKIP_TASKS }}
          WORKBUDDY_MP_GAP: ${{ secrets.WORKBUDDY_MP_GAP }}
          WORKBUDDY_MAKEUP_MAX_PER_RUN: ${{ secrets.WORKBUDDY_MAKEUP_MAX_PER_RUN }}
          # 上游 v3.16 新增：热力图未计分时是否补一次真实对话（不传则脚本默认 True）
          WORKBUDDY_ACTIVITY_CHAT_FALLBACK: ${{ secrets.WORKBUDDY_ACTIVITY_CHAT_FALLBACK }}
        run: python workbuddy_daily.py

      # ⚠️ 仅在【私有仓库】中持久化令牌/福利期次状态；公开仓库会跳过，避免 RT 泄露
      # ⚠️ fork 约定：本步骤必须紧贴上游原文（名称、位置、内容都不改），国际版步骤一律放在它之后。
      #    上游 v3.15 曾在此处重命名+加文件，与夹在中间的 fork 步骤撞成内容冲突，导致 sync-upstream 失败。
      - name: Persist runtime state (private repo only)
        if: always() && github.event.repository.private == true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wb_refresh_tokens.json 2>/dev/null || true
          git add -f workbuddy_benefit_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "运行状态无变化"
          else
            git commit -m "chore: 更新运行状态 [skip ci]"
            git push
          fi

      # ---- 以下为 fork 特有步骤，与上游不重叠；新增上游同步内容时请保持放在这一区段 ----

      # 🌍 国际版（www.workbuddy.ai）每日活跃：探测 → 领取 → 免费模型保活
      # 与国际版登录态分开配置：WORKBUDDY_INTL_TOKENS = 备注|AT|uid|RT（RT 可续期）
      - name: Run WorkBuddy AI (international)
        if: always()
        continue-on-error: true
        env:
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          WORKBUDDY_INTL_MODELS: ${{ secrets.WORKBUDDY_INTL_MODELS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          QYWX_TOKEN: ${{ secrets.QYWX_TOKEN }}
          NO_NOTIFY: ${{ secrets.NO_NOTIFY }}
        run: python workbuddy_intl_daily.py

  # 🔄 自动同步上游（L0NE-6 → 本 fork）
  # 串在签到 job 之后：令牌持久化与同步都要 push，串行可避开并发 non-fast-forward
  sync-upstream:
    needs: run
    if: always()            # 签到失败/跳过也要同步，避免卡在上游进度之外
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # merge 需要完整历史

      - name: Merge upstream
        env:
          UPSTREAM: L0NE-6/WorkBuddy-Daily
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main

          NEW=$(git rev-list --count "HEAD..upstream/main")
          if [ "$NEW" = "0" ]; then
            echo "✅ 已与上游齐平，无需同步"
            exit 0
          fi
          echo "📥 上游领先 ${NEW} 个提交，开始合并"

          # fork 特有内容（国际版步骤、wb_refresh_tokens.json）一律排在「Persist runtime state」
          # 之后，与上游改动的区段不重叠，正常不会冲突；万一冲突则失败并告警，交由人工处理
          git merge upstream/main --no-edit -m "chore: 同步上游 ${UPSTREAM}"

          # ⚠️ GITHUB_TOKEN 是 GitHub App 身份，没有 `workflows` 权限：只要本次提交动了
          # .github/workflows/**，push 就会被拒（"refusing to allow a GitHub App to create or
          # update workflow ... without `workflows` permission"）。2026-10-23 上游 v3.16 在
          # workbuddy.yml 加了一行 secret 传参，就是这个原因让 sync-upstream 失败。
          # 对策：合并后把 workflow 目录回退成本 fork 自己的版本（merge 提交已吸收上游历史，
          # 后续合并不会再冲突），上游对 workflow 的改动改为提示人工合入。
          # 仅在真的产生合并提交时检查（快进合并没有 HEAD^1，不能用它做比较基）
          if [ "$(git rev-list --count --merges HEAD^..HEAD)" != "0" ] \
             && ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
            echo "::warning::上游改动了 .github/workflows，已保留 fork 版本，请人工把改动合入"
            git checkout HEAD^1 -- .github/workflows
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
